# @file .github/workflows/validate.yml
# Purpose: Validate source and prepare verified installation files for CI and releases.
#
# Table of contents:
# 1. Workflow or configuration
# End file heading

name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting, lint, types, and unused code
        run: npm run check

      - name: Run unit and service tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and run offline browser tests
        run: npm run test:ui

      - name: Validate release version and changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME"

      - name: Upload verified installation files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/
          retention-days: 7
          if-no-files-found: error
